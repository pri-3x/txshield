# TxShield local stack: API + PostgreSQL + Redis + migrations.
#
#   cp .env.example .env    # set TXSHIELD_RPC_URLS
#   docker compose up --build
#   curl localhost:8080/health
#   open http://localhost:3000           # dashboard
#
# Ports bind to 127.0.0.1 only. Postgres is published on 55432 to avoid
# clashing with a locally installed Postgres.
name: txshield

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: txshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txshield}
      POSTGRES_DB: txshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txshield -d txshield"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.1
    command: ["-path=/migrations", "-database", "postgres://txshield:${POSTGRES_PASSWORD:-txshield}@postgres:5432/txshield?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        VERSION: ${TXSHIELD_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      TXSHIELD_DATABASE_URL: postgres://txshield:${POSTGRES_PASSWORD:-txshield}@postgres:5432/txshield?sslmode=disable
      TXSHIELD_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    # anvil needs a writable HOME for transient files; nothing persists.
    tmpfs:
      - /tmp:size=256m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      TXSHIELD_API_URL: http://api:8080
      # Must match one of the API's TXSHIELD_API_KEYS when keys are enabled.
      TXSHIELD_API_KEY: ${TXSHIELD_DASHBOARD_API_KEY:-}
      # "user:password" (password >= 16 chars) to require HTTP Basic auth.
      TXSHIELD_DASHBOARD_BASIC_AUTH: ${TXSHIELD_DASHBOARD_BASIC_AUTH:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

volumes:
  pgdata:
