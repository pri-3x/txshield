version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
  settings:
    errcheck:
      # CLI output to stdout/stderr: a failed terminal write is not actionable.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    gosec:
      excludes:
        - G104 # unchecked errors are covered by errcheck
  exclusions:
    rules:
      # Test harnesses launch fixed local tools (forge, anvil, the built
      # binary) and read fixture files by design.
      - path: tests/
        linters: [gosec]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
